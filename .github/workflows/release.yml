name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release-mac:
    # GitHub's Xcode 27 preview runner provides the macOS 27 SDK.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Show macOS build environment
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify tag
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec electron-builder --mac dmg --arm64 --x64 --publish never
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: dist-electron/*.dmg

  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify tag
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec electron-builder --win nsis --x64 --publish never
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: dist-electron/*.exe

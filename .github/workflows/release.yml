name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            builderArgs: --mac --arm64 --x64
          - os: windows-latest
            builderArgs: --win --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify tag
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: pnpm typecheck
      - if: runner.os == 'macOS'
        run: pnpm test
      - run: pnpm build
      - run: pnpm exec electron-builder ${{ matrix.builderArgs }} --publish never
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist-electron/*

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: macos-26
            command: build:mac
            args: --arm64 --x64
          - os: windows-latest
            command: build:win
            args: ""
          - os: ubuntu-latest
            command: build:linux
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify tag
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: pnpm check
      - run: pnpm ${{ matrix.command }} -- ${{ matrix.args }} --publish never
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist-electron/*

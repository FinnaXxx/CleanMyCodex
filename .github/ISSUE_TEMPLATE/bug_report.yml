name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include credentials, session contents, thread IDs, usernames or unredacted local paths. Report security issues privately through the Security tab.
  - type: input
    id: app-version
    attributes:
      label: Clean My Codex version
      placeholder: v0.1.3
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Include the operating-system version and CPU architecture.
      placeholder: macOS 15.x, Apple Silicon
    validations:
      required: true
  - type: input
    id: codex-version
    attributes:
      label: Codex version
      description: Include the Codex Desktop or CLI version when known.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add redacted screenshots or log excerpts if they are necessary.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials, session contents, thread IDs, usernames and private local paths.
          required: true
        - label: This is not a security vulnerability.
          required: true
